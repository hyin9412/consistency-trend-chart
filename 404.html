<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Redirecting...</title>
    <script>
      (function () {
        var pathname = window.location.pathname;
        var search = window.location.search || '';
        var hash = window.location.hash || '';
        var segmentCount = 1;
        var repoPath = pathname
          .split('/')
          .slice(0, 1 + segmentCount)
          .join('/');
        var routePath = pathname.slice(repoPath.length) || '/';
        var params = new URLSearchParams();

        params.set('__gh_path', routePath);
        if (search) {
          params.set('__gh_search', search.slice(1));
        }
        if (hash) {
          params.set('__gh_hash', hash.slice(1));
        }

        window.location.replace(repoPath + '/?' + params.toString());
      })();
    </script>
  </head>
  <body></body>
</html>
